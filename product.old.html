<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Product | Lightora</title>

    <link
        rel="stylesheet"
        href="css/global.css">

    <link
        rel="stylesheet"
        href="css/product.css">

</head>

<body>


<header class="store-header">

    <div class="logo">

        <h2>
            LIGHTORA
        </h2>

    </div>


    <nav>

        <a href="pages/store.html">
            Home
        </a>


        <a href="pages/store.html#products">
            Shop
        </a>


        <a href="pages/cart.html">

            🛒 Cart

            <span id="cartCount">
                0
            </span>

        </a>

    </nav>

</header>



<main class="product-page">


    <div class="product-image">

        <img
            id="productImage"
            src="images/perfume.png"
            alt="Product">

    </div>



    <div class="product-info">


        <p
            id="productCategory"
            class="category">

            Loading...

        </p>



        <h1 id="productName">

            Loading product...

        </h1>



        <h2 id="productPrice">

            0 DA

        </h2>



        <p id="productDescription">

            Loading product description...

        </p>



        <div class="stock">

            Stock:

            <span id="productStock">
                0
            </span>

        </div>



        <div class="quantity">


            <button
                type="button"
                id="decreaseQuantity">

                −

            </button>



            <input
                type="number"
                id="quantity"
                value="1"
                min="1">



            <button
                type="button"
                id="increaseQuantity">

                +

            </button>


        </div>



        <button
            type="button"
            id="addToCartBtn"
            class="buy-btn">

            Add to Cart

        </button>



        <a
            href="pages/store.html"
            class="back-link">

            ← Back to Store

        </a>


    </div>


</main>



<script
    type="module"
    src="js/product.js">

</script>


</body>

</html>
