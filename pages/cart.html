<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Shopping Cart | Lightora</title>

    <link
        rel="stylesheet"
        href="../css/global.css">

    <link
        rel="stylesheet"
        href="../css/cart.css">

</head>

<body>

<header class="store-header">

    <div class="logo">

        <h2>
            LIGHTORA
        </h2>

    </div>

    <nav>

        <a href="store.html">
            Home
        </a>

        <a href="store.html#products">
            Shop
        </a>

        <a href="cart.html">
            🛒 Cart
            <span id="cartCount">0</span>
        </a>

    </nav>

</header>


<main class="cart-page">

    <h1>
        Your Shopping Cart
    </h1>


    <div id="cartContainer">

        <!-- Cart products will appear here -->

    </div>


    <div class="cart-summary">

        <h2>
            Order Summary
        </h2>

        <p>

            Total:

            <strong id="cartTotal">
                0 DA
            </strong>

        </p>


        <button
            id="checkoutBtn"
            class="checkout-btn">

            Proceed to Checkout

        </button>


        <a
            href="store.html"
            class="continue-shopping">

            ← Continue Shopping

        </a>

    </div>

</main>


<script
    type="module"
    src="../js/cart.js">
</script>

</body>

</html>
