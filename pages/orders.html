<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Orders | Lightora</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/orders.css"
    >

</head>


<body>

    <div class="container">


        <!-- =========================
             PAGE HEADER
        ========================== -->

        <div class="page-header">

            <h1>
                Orders
            </h1>

        </div>


        <!-- =========================
             TOOLBAR
        ========================== -->

        <div class="toolbar">

            <input
                id="searchOrder"
                type="text"
                placeholder="Search Order..."
            >


            <select id="statusFilter">

                <option value="All Orders">
                    All Orders
                </option>

                <option value="Pending">
                    Pending
                </option>

                <option value="Processing">
                    Processing
                </option>

                <option value="Completed">
                    Completed
                </option>

                <option value="Cancelled">
                    Cancelled
                </option>

            </select>

        </div>


        <!-- =========================
             ORDERS TABLE
        ========================== -->

        <table class="orders-table">

            <thead>

                <tr>

                    <th>
                        Order ID
                    </th>

                    <th>
                        Customer
                    </th>

                    <th>
                        Total
                    </th>

                    <th>
                        Status
                    </th>

                    <th>
                        Date
                    </th>

                    <th>
                        Actions
                    </th>

                </tr>

            </thead>


            <tbody id="ordersTableBody">

                <!-- Orders loaded by JavaScript -->

            </tbody>

        </table>


    </div>


    <!-- =========================
         ORDERS JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="../js/orders.js"
    ></script>

    <script
    type="module"
    src="../js/authGuard.js">
</script>
</body>

</html>
