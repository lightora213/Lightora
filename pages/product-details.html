<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Product Details | Lightora</title>

<link
    rel="stylesheet"
    href="../css/global.css"
>

<link
    rel="stylesheet"
    href="../css/product-details.css"
>

</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header class="product-header">

    <a
        href="store.html"
        class="store-logo"
    >

        LIGHTORA

    </a>


    <a
        href="cart.html"
        class="cart-link"
    >

        Cart

        <span id="cartCount">
            0
        </span>

    </a>

</header>


<!-- =========================
     PRODUCT
========================= -->

<main class="product-container">


    <!-- PRODUCT IMAGE -->

    <div class="product-image">

        <img
            id="productImage"
            src="../assets/images/perfume.jpg"
            alt="Product"
        >

    </div>


    <!-- PRODUCT INFORMATION -->

    <div class="product-info">


        <!-- CATEGORY -->

        <p
            class="category"
            id="productCategory"
        >

            -

        </p>


        <!-- NAME -->

        <h1 id="productName">

            Loading product...

        </h1>


        <!-- PRICE -->

        <h2 id="productPrice">

            0 DA

        </h2>


        <!-- DESCRIPTION -->

        <p
            id="productDescription"
            class="product-description"
        >

            Loading description...

        </p>


        <!-- STOCK -->

        <div class="stock">

            Stock:

            <span id="productStock">

                0

            </span>

        </div>


        <!-- STATUS -->

        <div class="status">

            Status:

            <span id="productStatus">

                Loading...

            </span>

        </div>


        <!-- ACTIONS -->

        <div class="actions">


            <!-- ADD TO CART -->

            <button
                id="addToCartBtn"
                class="add-to-cart-btn"
            >

                Add to Cart

            </button>


            <!-- BACK -->

            <button
                id="backBtn"
                class="back-btn"
            >

                ← Back to Products

            </button>


        </div>


    </div>


</main>


<script
    type="module"
    src="../js/product-details.js"
></script>


</body>

</html>
