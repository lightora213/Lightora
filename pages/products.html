<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Products | Lightora</title>

    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <link
        rel="stylesheet"
        href="../css/products.css"
    >

</head>


<body>

    <!-- =========================
         HEADER
    ========================== -->

    <header class="store-header">

        <div class="logo">

            <h2>
                LIGHTORA
            </h2>

        </div>


        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="products.html">
                Products
            </a>

            <a href="add-product.html">
                Add Product
            </a>

            <a href="orders.html">
                Orders
            </a>

            <a href="store.html">
                Store
            </a>

        </nav>

    </header>


    <!-- =========================
         PRODUCTS PAGE
    ========================== -->

    <main class="products-page">

        <div class="products-header">

            <div>

                <h1>
                    My Products
                </h1>

                <p>
                    Manage the products in your Lightora store.
                </p>

            </div>


            <a
                href="add-product.html"
                class="buy-btn"
            >
                + Add Product
            </a>

        </div>


        <!-- =========================
             PRODUCTS GRID
        ========================== -->

        <section>

            <div
                id="productsGrid"
                class="grid"
            >

                <div class="product-card">

                    <p>
                        Loading products...
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script
        type="module"
        src="../js/products-list.js"
    ></script>


    <script
        type="module"
        src="../js/authGuard.js"
    ></script>


</body>

</html>
