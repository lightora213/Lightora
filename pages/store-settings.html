<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Store Settings</title>

<link rel="stylesheet"
href="../css/global.css">

<link rel="stylesheet"
href="../css/store-settings.css">

</head>

<body>

<div class="container">

<h1>Store Settings</h1>

<form id="storeForm">

<div class="form-group">

<label>Store Name</label>

<input
type="text"
id="storeName"
placeholder="Lightora">

</div>

<div class="form-group">

<label>Store Description</label>

<textarea
id="storeDescription"
rows="5"></textarea>

</div>

<div class="form-group">

<label>Phone</label>

<input
type="text"
id="storePhone">

</div>

<div class="form-group">

<label>Email</label>

<input
type="email"
id="storeEmail">

</div>

<div class="form-group">

<label>Address</label>

<input
type="text"
id="storeAddress">

</div>

<div class="form-group">

<label>Logo</label>

<input
type="file">

</div>

<div class="form-group">

<label>Banner</label>

<input
type="file">

</div>

<button type="submit">

Save Changes

</button>

</form>

</div>

<script
    type="module"
    src="../js/store-settings.js">
</script>
<script
    type="module"
    src="../js/authGuard.js">
</script>
</body>

</html>
