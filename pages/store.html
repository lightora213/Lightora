<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Lightora Store</title>

    <link
        rel="stylesheet"
        href="../css/global.css">

    <link
        rel="stylesheet"
        href="../css/store.css">

</head>


<body>


<!-- =========================
     STORE HEADER
========================== -->

<header class="store-header">

    <div class="logo">

        <h2 id="storeLogoName">
            Loading...
        </h2>

    </div>


    <nav>

        <a href="store.html">
            Home
        </a>

        <a href="store.html#products">
            Shop
        </a>

        <a href="store.html#about">
            About
        </a>

        <a href="store.html#contact">
            Contact
        </a>

        <a href="cart.html">

            🛒 Cart

            <span id="cartCount">0</span>

        </a>

    </nav>

</header>



<!-- =========================
     HERO
========================== -->

<section class="hero">

    <div>

        <h1 id="storeHeroTitle">
            Discover Our Products
        </h1>


        <p id="storeHeroDescription">
            Loading store information...
        </p>


        <a
            href="#products"
            class="shop-btn">

            Shop Now

        </a>

    </div>


    <img
        id="storeBanner"
        src="../images/perfume.jpg"
        alt="Store Banner">

</section>



<!-- =========================
     PRODUCTS
========================== -->

<section
    class="products"
    id="products">

    <h2>
        Featured Products
    </h2>


    <div
        class="grid"
        id="productsGrid">

        <div class="product-card">

            <p>
                Loading products...
            </p>

        </div>

    </div>

</section>



<!-- =========================
     ABOUT
========================== -->

<section
    id="about"
    class="store-about">

    <h2 id="aboutStoreName">
        About Our Store
    </h2>


    <p id="aboutStoreDescription">
        Loading store information...
    </p>

</section>



<!-- =========================
     CONTACT
========================== -->

<section
    id="contact"
    class="store-contact">

    <h2>
        Contact Us
    </h2>


    <p id="storePhone"></p>

    <p id="storeEmail"></p>

    <p id="storeAddress"></p>

</section>



<!-- =========================
     JAVASCRIPT
========================== -->

<script
    type="module"
    src="../js/store.js">
</script>


</body>

</html>
