<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Registration Unavailable - Lightora</title>

    <!-- Global Styles -->
    <link
        rel="stylesheet"
        href="../css/global.css"
    >

    <!-- Authentication Styles -->
    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>


<body>

    <!-- =========================
         REGISTRATION TEMPORARILY DISABLED
    ========================== -->

    <main class="auth-page">

        <div class="auth-card">

            <!-- Logo -->

            <a
                href="../index.html"
                class="auth-logo"
            >

                <img
                    src="../images/Logo 222.png"
                    alt="Lightora"
                >

            </a>


            <!-- Heading -->

            <h1>
                Registration Temporarily Unavailable
            </h1>


            <p class="auth-subtitle">

                New account registration is currently
                unavailable while we prepare Lightora
                for launch.

            </p>


            <!-- Information -->

            <div class="form-group">

                <p>
                    If you already have a Lightora account,
                    you can continue using your account.
                </p>

            </div>


            <!-- Login -->

            <a
                href="login.html"
                class="auth-button"
                style="display: block; text-align: center; text-decoration: none;"
            >
                Login to Your Account
            </a>


            <!-- Back Home -->

            <a
                href="../index.html"
                class="back-home"
            >
                ← Back to Lightora
            </a>


        </div>

    </main>

</body>

</html>
